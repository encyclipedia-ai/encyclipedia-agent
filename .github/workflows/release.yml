name: Release Librarian

# Builds Encyclipedia Librarian (desktop app) for Mac, Windows, and Linux.
# Tag `agent-v1.0.0` (or run this workflow manually) to publish.
# Optional MAC_CERT_P12/MAC_CERT_PASSWORD/Apple and WINDOWS_CERT_P12/
# WINDOWS_CERT_PASSWORD secrets enable signing; unsigned packages remain valid.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      publish_stable:
        description: "Also publish this build to the public stable feed"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.cjs

      - name: Install and package
        shell: bash
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 || matrix.os == 'windows-latest' && secrets.WINDOWS_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || matrix.os == 'windows-latest' && secrets.WINDOWS_CERT_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (secrets.MAC_CERT_P12 != '' || secrets.WINDOWS_CERT_P12 != '') && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          pnpm install --frozen-lockfile
          pnpm test
          pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librarian-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-out
          merge-multiple: true

      - name: Build public download manifest
        if: github.ref_type == 'tag' || inputs.publish_stable
        env:
          RELEASE_PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/build-release-manifest.cjs dist-out dist-out/latest.json

      - name: Authenticate to Google Cloud
        if: github.ref_type == 'tag' || inputs.publish_stable
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SA }}

      - name: Set up Google Cloud CLI
        if: github.ref_type == 'tag' || inputs.publish_stable
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish public installers and OTA metadata
        if: github.ref_type == 'tag' || inputs.publish_stable
        env:
          DOWNLOADS_BUCKET: ${{ vars.GCP_DOWNLOADS_BUCKET }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_ROOT="gs://${DOWNLOADS_BUCKET}/librarian/releases/${VERSION}"
          LATEST_ROOT="gs://${DOWNLOADS_BUCKET}/librarian"

          gcloud storage cp \
            --cache-control="public,max-age=31536000,immutable" \
            dist-out/* "${VERSION_ROOT}/"

          gcloud storage cp \
            --cache-control="public,max-age=31536000,immutable" \
            dist-out/*.dmg dist-out/*.exe dist-out/*.AppImage \
            dist-out/*.zip dist-out/*.blockmap \
            "${LATEST_ROOT}/"

          gcloud storage cp \
            --cache-control="no-store,max-age=0" \
            dist-out/latest.yml dist-out/latest-mac.yml dist-out/latest-linux.yml \
            "${LATEST_ROOT}/"

          gcloud storage cp \
            --cache-control="no-store,max-age=0" \
            --content-type="application/json" \
            dist-out/latest.json "${LATEST_ROOT}/latest.json"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('agent-nightly-{0}', github.run_id) }}
          name: Encyclipedia Librarian ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          files: dist-out/**
