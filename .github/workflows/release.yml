name: Release Helper

# Builds one binary per OS so customers never install Node.
# Tag `agent-v0.2.0` (or run this workflow manually) to publish.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile binaries
        run: |
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile encyclipedia-agent-darwin-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64 --outfile encyclipedia-agent-darwin-x64
          bun build src/index.ts --compile --target=bun-linux-x64 --outfile encyclipedia-agent-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64 --outfile encyclipedia-agent-linux-arm64
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile encyclipedia-agent-windows-x64.exe
          ls -la encyclipedia-agent-*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('agent-nightly-{0}', github.run_id) }}
          name: Encylipedia Helper ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          generate_release_notes: true
          files: |
            encyclipedia-agent-darwin-arm64
            encyclipedia-agent-darwin-x64
            encyclipedia-agent-linux-x64
            encyclipedia-agent-linux-arm64
            encyclipedia-agent-windows-x64.exe
