<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'"
    />
    <title>The Librarian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="crest" aria-hidden="true">Æ</div>
      <div>
        <h1>The Librarian</h1>
        <p class="brand">encyclipedia.ai</p>
        <p class="tag smallcaps">A Library of Clips</p>
      </div>
    </header>

    <section id="status-card" class="card">
      <div class="row">
        <span id="dot" class="dot off" aria-hidden="true"></span>
        <strong id="status-label">Opening</strong>
      </div>
      <p id="status-message">Opening the stacks…</p>
      <p id="status-email" class="muted"></p>
    </section>

    <section id="login" class="card hidden">
      <h2 class="card-title">Sign in to the library</h2>
      <form id="login-form">
        <label>
          Email
          <input
            id="email"
            type="email"
            autocomplete="username"
            required
          />
        </label>
        <label>
          Password
          <span class="password-wrap">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              id="toggle-password"
              class="toggle-pass"
              type="button"
              aria-pressed="false"
            >
              Show
            </button>
          </span>
        </label>
        <button id="sign-in" type="submit">Enter the library</button>
      </form>
      <div class="fleuron" role="separator"><span>or</span></div>
      <button id="google-sign-in" class="google" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#EA4335"
            d="M12 11v3.4h4.7c-.2 1.2-1.4 3.6-4.7 3.6-2.8 0-5.1-2.3-5.1-5.2S9.2 7.6 12 7.6c1.6 0 2.7.7 3.3 1.3l2.3-2.2C16.1 5.3 14.2 4.5 12 4.5c-4.1 0-7.5 3.4-7.5 7.5s3.4 7.5 7.5 7.5c4.3 0 7.2-3 7.2-7.3 0-.5 0-.9-.1-1.2H12z"
          />
        </svg>
        Continue with Google
      </button>
    </section>

    <section id="clipper" class="card hidden">
      <h2 class="card-title">Request a clipping</h2>
      <form id="clip-form">
        <label>
          YouTube URL
          <input
            id="url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=…"
            required
          />
        </label>
        <div class="row lengths">
          <label class="choice">
            <input type="radio" name="length" value="short" checked />
            Short
          </label>
          <label class="choice">
            <input type="radio" name="length" value="medium" />
            Medium
          </label>
        </div>
        <button id="clip" type="submit">Clip this volume</button>
      </form>
      <section id="queue-wrap" class="queue-wrap">
        <h3 class="queue-heading">The line</h3>
        <ol id="queue" class="queue"></ol>
        <p id="queue-empty" class="hint">No volumes in line. Paste a URL to begin.</p>
      </section>
      <p class="hint">
        Leave this window open. Jobs from the web app or phone also run here.
      </p>
      <button id="sign-out" class="ghost" type="button">Leave the library</button>
    </section>

    <script src="ui.js"></script>
  </body>
</html>
